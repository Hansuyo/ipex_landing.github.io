<body>
    <div id="header"></div>

    <header class="page-header text-center">

        <div class="container mb-5">
            <div class="table-responsive">

                    <thead>
                        <tr class="text-center">
                            <th style="width: 10%;">번호</th>

                        <tr class="text-center">

                            </td>
                            <td class="text-muted">2026-03-16</td>
                            <td>관리자</td>
                        </tr>
                        <tr class="text-center">
                            <td>1</td>
                            <td class="text-start">
                                <a href="notice/notice_01.html" class="notice-title">[공지] (주)아이펙스 홈페이지 리뉴얼 안내</a>
                            </td>

        <div class="py-3 my-3"></div> 
        <div class="py-5 my-5"></div>

        <button type="button" id="btn-back-to-top" class="btn btn-primary btn-lg shadow" title="맨 위로 이동">
            <i class="bi bi-arrow-up"></i>
        </button>
    
        <div id="footer"></div>
        <script>
            // 헤더 불러오기
            fetch('header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header').innerHTML = data;
                });
        
            // 푸터 불러오기
            fetch('footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer').innerHTML = data;
                });
        </script>  
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 버튼 요소 가져오기
        const backToTopBtn = document.getElementById("btn-back-to-top");
        
        // 사용자가 스크롤을 20px 이상 내리면 버튼을 보여줌
        window.onscroll = function () {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                backToTopBtn.style.display = "block";
            } else {
                backToTopBtn.style.display = "none";
            }
        };
        
        // 버튼을 클릭하면 페이지 상단으로 부드럽게 이동
        backToTopBtn.addEventListener("click", function () {
            window.scrollTo({
                top: 0,
                behavior: "smooth" // 부드러운 스크롤 효과
            });
        });        
    </script>
